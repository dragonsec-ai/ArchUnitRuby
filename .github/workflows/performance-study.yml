name: Representative performance study

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmark/study/**'
      - 'benchmark/semantic/**'
      - 'spec/benchmark/performance_study_spec.rb'
      - 'spec/benchmark/rule_suite_spec.rb'
      - '.github/workflows/performance-study.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study:
    name: Oracle-checked Linux performance evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: archunit/benchmark/study
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: archunit
          persist-credentials: false

      - name: Check out pinned Rails application as source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: discourse/discourse
          ref: 2de9c9be4f89e392fe500dd27f928d6b1184bf09
          path: corpus
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lib/**/*.rb
            /app/**/*.rb
            /config/**/*.rb
            /src/**/*.rb
            /*.rb
            /*.gemspec
            /Gemfile
            /.archignore
            /LICENSE*
            /README*
            !/**/fixtures/**
            !/**/spec/**
            !/**/test/**
            !/**/tests/**

      - name: Set up isolated checksum-locked research dependencies
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: archunit/benchmark/study

      - name: Repeated alternating shared-policy trials and fresh startup
        run: bundle exec ruby run.rb --archspec ../../pkg/study-linux.json
        env:
          STUDY_PAIRS: '100'
          STUDY_TRIALS: '5'

      - name: Reproduce bounded semantic comparison on Linux
        run: bundle exec ruby ../semantic/probes.rb --archspec ../../pkg/semantic-linux.json

      - name: Profile real pinned production source without booting it
        run: bundle exec ruby real_project.rb ../../../corpus ../../pkg/discourse-linux.json

      - name: Retain raw evidence and exact dependency lock
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: performance-study-${{ github.run_id }}
          path: |
            archunit/pkg/study-linux.json
            archunit/pkg/semantic-linux.json
            archunit/pkg/discourse-linux.json
            archunit/benchmark/study/Gemfile.lock
          if-no-files-found: warn
          retention-days: 14

  rule-suite:
    if: github.event_name == 'workflow_dispatch'
    name: Paired rule suites — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # #100 is already merged; isolate #101 rather than including walker gains.
          ref: e2d347e14e0f8d06489582bcb7c5473295a7df4b
          path: baseline
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: candidate
      - name: Compare identical harnesses in alternating fresh processes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $baseline = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $reports = Join-Path $env:GITHUB_WORKSPACE 'reports'
          New-Item -ItemType Directory -Path $reports -Force | Out-Null
          foreach ($file in 'fixture.rb','rule_policies.rb','rule_samples.rb','rule_suite.rb') {
            Copy-Item -LiteralPath (Join-Path $candidate "benchmark/study/$file") -Destination (Join-Path $baseline "benchmark/study/$file")
          }
          $env:BUNDLE_PATH = Join-Path $candidate 'vendor/bundle'
          $env:STUDY_PAIRS = '5000'
          foreach ($workload in 'graph','one','identical','varied') {
            foreach ($trial in 1..3) {
              $order = if ($trial % 2) { @('baseline','candidate') } else { @('candidate','baseline') }
              $results = @{}
              foreach ($side in $order) {
                $checkout = if ($side -eq 'baseline') { $baseline } else { $candidate }
                $env:BUNDLE_GEMFILE = Join-Path $checkout 'Gemfile'
                $env:STUDY_REVISION = git -C $checkout rev-parse HEAD
                $output = Join-Path $reports "$workload-$trial-$side.json"
                bundle exec ruby (Join-Path $checkout 'benchmark/study/rule_suite.rb') $workload $output
                if ($LASTEXITCODE -ne 0) { throw "Failed $workload / $side" }
                $results[$side] = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
              }
              if ($results.baseline.result.graph_sha256 -ne $results.candidate.result.graph_sha256) { throw 'Graph or evidence changed' }
            }
          }
      - name: Retain raw rule-suite measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rule-suite-${{ matrix.os }}-${{ github.run_id }}
          path: reports/*.json
          if-no-files-found: error
          retention-days: 14

  discovery:
    if: github.event_name == 'workflow_dispatch'
    name: Paired discovery — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v1.1.0
          path: baseline
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: candidate
      - name: Run alternating fresh-process pairs with the existing extraction benchmark
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $baseline = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $reports = Join-Path $env:GITHUB_WORKSPACE 'reports'
          New-Item -ItemType Directory -Path $reports -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $candidate 'benchmark/extraction.rb') -Destination (Join-Path $baseline 'benchmark/extraction.rb')
          $env:BUNDLE_PATH = Join-Path $candidate 'vendor/bundle'
          $cases = @(
            @{name='sparse-5000'; files=5000; imports=0; excluded=0},
            @{name='sparse-10000'; files=10000; imports=0; excluded=0},
            @{name='imports-1000'; files=1000; imports=3; excluded=0},
            @{name='excluded-1000'; files=1000; imports=0; excluded=3000}
          )
          foreach ($case in $cases) {
            foreach ($trial in 1..3) {
              $results = @{}
              foreach ($side in 'baseline','candidate') {
                $checkout = if ($side -eq 'baseline') { $baseline } else { $candidate }
                $env:BUNDLE_GEMFILE = Join-Path $checkout 'Gemfile'
                $output = Join-Path $reports "$($case.name)-$trial-$side.json"
                bundle exec ruby (Join-Path $checkout 'benchmark/extraction.rb') --files $case.files --gems 2 --imports-per-file $case.imports --excluded-files $case.excluded --constants --output $output | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "Failed $($case.name) / $side" }
                $results[$side] = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
                if (-not $results[$side].graph_cache_reused) { throw 'Graph cache was not reused' }
                if ($results[$side].cold.counters.source_files -ne ($case.files + 1)) { throw 'Wrong source inventory' }
                Write-Output "$($case.name) trial=$trial side=$side cold=$($results[$side].cold.stage_seconds.total) discovery=$($results[$side].cold.stage_seconds.source_enumeration) allocated=$($results[$side].cold.memory_growth.allocated_objects)"
              }
              if ($results.baseline.graph_sha256 -ne $results.candidate.graph_sha256) { throw 'Graph or retained evidence changed' }
            }
          }
      - name: Retain raw paired measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: discovery-${{ matrix.os }}-${{ github.run_id }}
          path: reports/*.json
          if-no-files-found: error
          retention-days: 14
